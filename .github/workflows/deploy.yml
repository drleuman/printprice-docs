name: Deploy Docusaurus to Plesk

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build and Deploy Site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: yarn

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      - name: Apply Mermaid SSG Hotfix
        run: |
          find docs src -type f \( -name "*.md" -o -name "*.mdx" \) -print0 2>/dev/null | xargs -0 perl -0pi -e 's/```mermaid/```text/g'

      - name: Build Docusaurus Static Site
        run: yarn build

      - name: Sync Files to Plesk via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./build/
          server-dir: ./
          dangerous-clean-slate: false
