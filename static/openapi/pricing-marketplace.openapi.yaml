openapi: 3.1.0
info:
  title: PrintPrice OS — Pricing & Marketplace Orders API
  version: 1.0.0
  description: |
    # PrintPrice OS — Pricing & Marketplace Orders API
    API for deterministic book pricing via the Book Pricing Engine (BPE),
    formal intake of production orders in DRAFT status, file metadata registration, and manufacturing readiness evaluation.
    
    - **Gateway Server:** `https://api.printprice.pro`
    - **Local Simulator (Prism):** `http://localhost:4010`
    - **Operational Safeguard:** Direct interactive mutations against production are disabled without certified partner credentials.
  contact:
    name: PrintPrice Architecture & Security Team
    email: api-support@printprice.pro
    url: https://docs.printprice.pro
  license:
    name: Proprietary / Partner Integration Only
    identifier: Proprietary

servers:
  - url: https://control.printprice.pro
    description: PrintPrice OS Control Plane & Self-Service Developer Gateway (Production & Sandbox)
  - url: https://api.printprice.pro
    description: Production Server (Requires partner credentials and commercial authorization)

tags:
  - name: Pricing & Offers
    description: Algorithmic book quoting and candidate print house offers via BPE.
  - name: Orders & File Governance
    description: Order intake, offer selection, file registration, and manufacturing readiness evaluation.

paths:
  /api/pricing/book-estimate:
    post:
      tags:
        - Pricing & Offers
      summary: Calculate real-time 5-axis book manufacturing cost and Q* crossover
      description: |
        Executes deterministic Book Pricing Engine (`PPOS_5AXIS_BPE_V2`) calibration and returns unit manufacturing cost, total cost, and the exact Digital vs. Offset crossover quantity (`qStarCopies`).
        - **Metered Billing (`pp_live_*`):** Reports `bpe_pricing_quote` (€0.005 / quote) to Stripe Billing Meters.
      operationId: calculateBookEstimate
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                trimWidthMm:
                  type: number
                  default: 148
                trimHeightMm:
                  type: number
                  default: 210
                pageCount:
                  type: integer
                  default: 240
                printRunCopies:
                  type: integer
                  default: 1200
                interiorPaperGsm:
                  type: integer
                  default: 90
                bindingType:
                  type: string
                  default: "SOFTCOVER_PUR"
      responses:
        '200':
          description: 5-axis BPE estimate and crossover analysis calculated.
          headers:
            X-RateLimit-Limit:
              description: Maximum requests per 60s window.
              schema:
                type: integer
            X-RateLimit-Remaining:
              description: Remaining requests in current window.
              schema:
                type: integer
        '402':
          description: Payment Required — Monthly spend cap (`monthly_spend_cap_eur`) reached or Production Scale subscription required (`SPEND_CAP_EXCEEDED_PAUSED` / `PAYWALL_REQUIRED`).
        '429':
          description: Too Many Requests — Sliding-window rate limit exceeded (`Retry-After` header returned).
  /api/marketplace/offers:
    post:
      tags:
        - Pricing & Offers
      summary: Request print house quotes and commercial offers
      description: |
        Deterministically calculates manufacturing costs and returns competitive offers from qualified print houses based on a book's physical specifications.
      operationId: requestMarketplaceOffers
      security:
        - {}
        - ApiKeyAuth: []
      parameters:
        - name: x-trace-id
          in: header
          required: false
          schema:
            type: string
          description: Distributed correlation identifier. If omitted, the gateway automatically generates a unique trace ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OfferRequestPayload'
            example:
              copies: 500
              interior_pages: 192
              format: "148x210"
              paper_inner: "offset_white_90"
              paper_cover: "couche_gloss_250"
              binding_method: "perfect_bound"
              finishing_options: "matt_lam_scratch"
              colors_inner: "1/1"
              colors_cover: "4/0"
              delivery_country: "ES"
      responses:
        '200':
          description: Offers successfully calculated, or controlled graceful fallback if BPE is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OffersResponse'
              examples:
                success:
                  summary: Offers successfully calculated
                  value:
                    success: true
                    recommended_offer_id: "off_01j7b9e84k2"
                    raw_recommended_offer_id: "ph_valencia_01"
                    trace_id: "trace_demo_12345"
                    offers:
                      - id: "off_01j7b9e84k2"
                        offer_id: "off_01j7b9e84k2"
                        house_id: "ph_valencia_01"
                        printer_id: "ph_valencia_01"
                        print_house_id: "ph_valencia_01"
                        print_house: "Levante Graphic Press"
                        total_cost: 1240.50
                        total_price: 1650.00
                        currency: "EUR"
                        margin: 409.50
                        margin_percent: 24.82
                        estimated_delivery_time: "5-7 business days"
                        lead_time_days: 6
                        breakdown:
                          - label: "Interior book block paper"
                            amount: 420.00
                          - label: "Printing and CTP plates"
                            amount: 380.50
                          - label: "Softcover PUR binding"
                            amount: 310.00
                          - label: "Packaging and EPAL palletization"
                            amount: 130.00
                        recommended: true
                        checkout_allowed: true
                        source: "BPE_MARKETPLACE_NATIVE"
        '400':
          description: Invalid request due to missing required fields (copies or interior_pages).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: "Missing required parameters: copies and interior_pages are mandatory."
                error_code: "INVALID_PAYLOAD"

  /api/marketplace/orders:
    post:
      tags:
        - Orders & File Governance
      summary: Create manufacturing order in DRAFT status
      description: |
        Registers a formal book manufacturing order by binding the pricing session and reserving mandatory file slots (`INTERIOR_PDF` and `COVER_PDF`).
      operationId: createMarketplaceOrder
      security:
        - MarketplaceToken: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderPayload'
            example:
              pricingSessionId: "sess_89f7a6e1-9876"
              selectedOfferId: "off_01j7b9e84k2"
              customer:
                name: "Minerva Publishing House Ltd."
                email: "production@minervapublishing.eu"
                phone: "+34 912 345 678"
                address:
                  street: "28 Gran Via Avenue, 4th Floor"
                  city: "Madrid"
                  postal_code: "28013"
                  country: "ES"
              bookSpec:
                copies: 500
                interior_pages: 192
                format: "148x210"
                paper_inner: "offset_white_90"
                paper_cover: "couche_gloss_250"
                binding: "softcover_pur"
                colors_inner: "1/1"
                colors_cover: "4/0"
      responses:
        '201':
          description: Order successfully created in draft status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderCreatedResponse'
              example:
                ok: true
                orderId: "ord_9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d"
                status: "DRAFT"
                requiredFiles:
                  - "INTERIOR_PDF"
                  - "COVER_PDF"
                readiness:
                  ready: false
                  blockers:
                    - "MISSING_REQUIRED_FILE_INTERIOR_PDF"
                    - "MISSING_REQUIRED_FILE_COVER_PDF"
        '400':
          description: Invalid or incomplete order payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid authentication token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/marketplace/orders/{orderId}:
    get:
      tags:
        - Orders & File Governance
      summary: Query order details and manufacturing readiness
      operationId: getMarketplaceOrder
      security:
        - MarketplaceToken: []
        - BearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
          description: Order UUID identifier.
      responses:
        '200':
          description: Full order details, linked files, and manufacturing readiness status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetailResponse'
        '404':
          description: Order not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/marketplace/orders/{orderId}/selected-offer:
    post:
      tags:
        - Orders & File Governance
      summary: Lock or update the commercial offer for the order
      operationId: selectOrderOffer
      security:
        - MarketplaceToken: []
        - BearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                selectedOffer:
                  type: object
                  properties:
                    offerId:
                      type: string
                    totalPrice:
                      type: number
                offerId:
                  type: string
                totalPrice:
                  type: number
            example:
              offerId: "off_01j7b9e84k2"
              totalPrice: 1650.00
      responses:
        '200':
          description: Commercial offer successfully locked.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  orderId:
                    type: string
                  selectedOfferId:
                    type: string
        '400':
          $ref: '#/components/responses/ErrorResponse'

  /api/marketplace/orders/{orderId}/files/register:
    post:
      tags:
        - Orders & File Governance
      summary: Register metadata for an uploaded PDF file
      operationId: registerOrderFile
      security:
        - MarketplaceToken: []
        - BearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - role
                - originalName
                - mimeType
                - sizeBytes
                - checksumSha256
                - storagePath
              properties:
                role:
                  type: string
                  enum: [INTERIOR_PDF, COVER_PDF]
                originalName:
                  type: string
                mimeType:
                  type: string
                  default: "application/pdf"
                sizeBytes:
                  type: integer
                checksumSha256:
                  type: string
                storagePath:
                  type: string
            example:
              role: "INTERIOR_PDF"
              originalName: "book_interior_final.pdf"
              mimeType: "application/pdf"
              sizeBytes: 15420310
              checksumSha256: "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
              storagePath: "orders/ord_123/interior_v1.pdf"
      responses:
        '201':
          description: File metadata successfully registered.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  fileId:
                    type: string
                  orderId:
                    type: string
                  role:
                    type: string
                  status:
                    type: string
        '400':
          $ref: '#/components/responses/ErrorResponse'

  /api/marketplace/orders/{orderId}/files/{fileId}/preflight-bind:
    post:
      tags:
        - Orders & File Governance
      summary: Bind an order file to a Preflight inspection job
      operationId: bindPreflightJob
      security:
        - MarketplaceToken: []
        - BearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
        - name: fileId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - preflightJobId
              properties:
                preflightJobId:
                  type: string
            example:
              preflightJobId: "pf_job_8a7d6e5c-1234"
      responses:
        '200':
          description: Order file bound to the preflight inspection job.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  fileId:
                    type: string
                  preflightJobId:
                    type: string
                  boundAt:
                    type: string
        '400':
          $ref: '#/components/responses/ErrorResponse'

  /api/marketplace/orders/{orderId}/readiness/recompute:
    post:
      tags:
        - Orders & File Governance
      summary: Deterministically recompute manufacturing readiness
      operationId: recomputeOrderReadiness
      security:
        - MarketplaceToken: []
        - BearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Manufacturing readiness status evaluated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  orderId:
                    type: string
                  status:
                    type: string
                    enum: [READY, BLOCKED]
                  readiness:
                    type: object
                    properties:
                      ready:
                        type: boolean
                      blockers:
                        type: array
                        items:
                          type: string
        '400':
          $ref: '#/components/responses/ErrorResponse'

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Partner API key prefixed with ppos_live_ or ppos_test_.
    MarketplaceToken:
      type: apiKey
      in: header
      name: X-Marketplace-Token
      description: Secret M2M order intake token.
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    OfferRequestPayload:
      type: object
      required:
        - copies
        - interior_pages
      properties:
        copies:
          type: integer
          minimum: 1
          description: Total quantity of book copies to print.
        interior_pages:
          type: integer
          minimum: 1
          description: Number of pages in the interior book block (multiple of 4 or 2 depending on binding).
        format:
          type: string
          example: "148x210"
        paper_inner:
          type: string
          example: "offset_white_90"
        paper_cover:
          type: string
          example: "couche_gloss_250"
        binding_method:
          type: string
          example: "perfect_bound"
        finishing_options:
          type: string
          example: "matt_lam_scratch"
        colors_inner:
          type: string
          example: "1/1"
        colors_cover:
          type: string
          example: "4/0"
        delivery_country:
          type: string
          example: "ES"

    OffersResponse:
      type: object
      properties:
        success:
          type: boolean
        offers:
          type: array
          items:
            $ref: '#/components/schemas/OfferItem'
        recommended_offer_id:
          type:
            - string
            - "null"
        raw_recommended_offer_id:
          type:
            - string
            - "null"
        trace_id:
          type: string

    OfferItem:
      type: object
      properties:
        id:
          type: string
        offer_id:
          type: string
        house_id:
          type: string
        printer_id:
          type: string
        print_house_id:
          type: string
        print_house:
          type: string
        total_cost:
          type: number
        total_price:
          type: number
        currency:
          type: string
          example: "EUR"
        margin:
          type: number
        margin_percent:
          type: number
        estimated_delivery_time:
          type: string
        lead_time_days:
          type: integer
        breakdown:
          type: array
          items:
            type: object
            properties:
              label:
                type: string
              amount:
                type: number
        recommended:
          type: boolean
        checkout_allowed:
          type: boolean
        source:
          type: string

    CreateOrderPayload:
      type: object
      required:
        - pricingSessionId
        - selectedOfferId
        - customer
        - bookSpec
      properties:
        pricingSessionId:
          type: string
        selectedOfferId:
          type: string
        customer:
          type: object
          properties:
            name:
              type: string
            email:
              type: string
            phone:
              type: string
            address:
              type: object
        bookSpec:
          type: object

    OrderCreatedResponse:
      type: object
      properties:
        ok:
          type: boolean
        orderId:
          type: string
        status:
          type: string
        requiredFiles:
          type: array
          items:
            type: string
        readiness:
          type: object
          properties:
            ready:
              type: boolean
            blockers:
              type: array
              items:
                type: string

    OrderDetailResponse:
      type: object
      properties:
        ok:
          type: boolean
        order:
          type: object

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
        ok:
          type: boolean
        message:
          type: string
        error_code:
          type: string
        error:
          type: string

  responses:
    ErrorResponse:
      description: Request error or validation failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
