openapi: 3.1.0
info:
  title: PrintPrice OS Partner Developer API (Draft)
  version: 0.2.0-draft
  description: |
    # PrintPrice OS Developer Platform — OpenAPI 3.1 Specification (Draft DEV-02)

    **Important Governance Notice:**
    This specification has been audited and verified field-by-field against the active runtime source code of PrintPrice OS Control Plane (`ppos-control-plane-phase-10-intelligence-layer`).

    - **Contract Status:** `DRAFT_CONTRACT` (Partner Integration Draft Mode).
    - **Operational Scope:** Algorithmic offer quoting, order intake and file governance, and shared Preflight diagnostic contracts.
    - **Surface Separation:** Administrative cross-tenant order management endpoints (`GET /api/marketplace/orders`) are strictly separated from this partner-oriented specification.
    - **Base Runtime Status:** `DEV-01B_PARTIAL` (Live probes executed; gateway upstreams and perimeter certificates verified).
    - **Operational Safeguard:** Executing mutative commercial transactions or test orders against production servers without authorization is strictly prohibited.
  contact:
    name: PrintPrice Architecture & Security Team
    url: https://docs.printprice.pro
  license:
    name: Proprietary / Partner Integration Only
    identifier: Proprietary

servers:
  - url: https://api.printprice.pro
    description: PrintPrice OS Production Server (Requires support-provisioned partner credentials)

tags:
  - name: Marketplace Offers
    description: Algorithmic book quoting and print house offers via the Book Pricing Engine (BPE).
  - name: Marketplace Orders
    description: Order intake, file metadata registration, and manufacturing readiness evaluation.
  - name: Public Preflight
    description: Shared visual preflight diagnostics and customer file remediation links.

paths:
  /api/marketplace/offers:
    post:
      tags:
        - Marketplace Offers
      summary: Request print house quotes and commercial offers
      description: |
        Generates comparative offers based on deterministic Book Pricing Engine (BPE) calculations for a book according to its physical specifications.
      operationId: requestMarketplaceOffers
      x-ppos-lifecycle: IMPLEMENTED_IN_CODE
      x-ppos-controller: src/api/routes/marketplacePublic.js:16
      x-ppos-runtime-status: PENDING_RUNTIME_VERIFICATION
      security: []
      parameters:
        - name: x-trace-id
          in: header
          required: false
          schema:
            type: string
          description: Distributed traceability identifier. If omitted, the controller automatically generates a UUID v4 (`trace_${uuidv4()}`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OfferRequestPayload'
            examples:
              standard_book_request:
                summary: Standard quote request with format code string
                value:
                  copies: 500
                  interior_pages: 192
                  format: "148x210"
                  paper_inner: "offset_white_90"
                  paper_cover: "couche_gloss_250"
                  binding: "softcover_pur"
                  colors_inner: "1/1"
                  colors_cover: "4/0"
              custom_dimensions_request:
                summary: Quote request with alternative standard format
                value:
                  copies: 1000
                  interior_pages: 128
                  format: "170x240"
                  paper_inner: "offset_white_90"
                  paper_cover: "couche_gloss_250"
                  binding: "softcover_pur"
                  colors_inner: "4/4"
                  colors_cover: "4/0"
      responses:
        '200':
          description: Offers successfully calculated (or controlled graceful fallback state if BPE is unavailable).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OffersResponse'
              examples:
                success_example:
                  summary: Offers successfully calculated
                  value:
                    success: true
                    recommended_offer_id: "off_01j7b9e84k2"
                    raw_recommended_offer_id: "ph_valencia_01"
                    trace_id: "trace_a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                    offers:
                      - id: "off_01j7b9e84k2"
                        offer_id: "off_01j7b9e84k2"
                        house_id: "ph_valencia_01"
                        printer_id: "ph_valencia_01"
                        print_house_id: "ph_valencia_01"
                        print_house: "Levante Graphic Press"
                        total_cost: 1240.50
                        total_price: 1650.00
                        currency: "EUR"
                        margin: 409.50
                        margin_percent: 24.82
                        estimated_delivery_time: "5-7 business days"
                        lead_time_days: 6
                        breakdown:
                          - label: "Interior book block paper"
                            amount: 420.00
                          - label: "Printing and CTP plates"
                            amount: 380.50
                          - label: "Softcover PUR binding"
                            amount: 310.00
                          - label: "Packaging and EPAL palletization"
                            amount: 130.00
                        recommended: true
                        checkout_allowed: true
                        source: "BPE_MARKETPLACE_NATIVE"
                        raw_offer:
                          lines:
                            - label: "Interior offset paper 90gsm"
                              amount: 420.00
                            - label: "Printing and CTP plates"
                              amount: 380.50
                          production_cost: 1240.50
                          suggested_price: 1650.00
                bpe_fallback_example:
                  summary: Controlled fallback when Pricing Engine is unavailable
                  value:
                    success: false
                    offers: []
                    message: "Pricing Engine unavailable."
                    error_code: "BPE_UNAVAILABLE"
        '400':
          description: Missing mandatory parameters (`copies` or `interior_pages`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
              example:
                success: false
                message: "Missing required parameters: copies and interior_pages are mandatory."
                error_code: "INVALID_PAYLOAD"
        '500':
          description: Internal orchestration or session persistence error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
              example:
                success: false
                message: "Failed to retrieve generated offers."
                error_code: "SESSION_RETRIVAL_ERROR"
                trace_id: "trace_err_12345"

  /api/marketplace/orders:
    post:
      tags:
        - Marketplace Orders
      summary: Create a new manufacturing order in draft status
      description: |
        Formalizes an order in `DRAFT` status and initializes the mandatory production file slots (`INTERIOR_PDF` and `COVER_PDF`).
      operationId: createMarketplaceOrder
      x-ppos-lifecycle: IMPLEMENTED_IN_CODE
      x-ppos-controller: src/api/routes/marketplaceOrders.js:77
      x-ppos-runtime-status: PENDING_RUNTIME_VERIFICATION
      security:
        - MarketplaceIntakeToken: []
        - BearerJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderPayload'
            example:
              pricingSessionId: "sess_89f7a6e1-9876"
              selectedOfferId: "off_01j7b9e84k2"
              customer:
                name: "Minerva Publishing House Ltd."
                email: "production@minervapublishing.eu"
                phone: "+34 912 345 678"
                address:
                  street: "28 Gran Via Avenue, 4th Floor"
                  city: "Madrid"
                  postal_code: "28013"
                  country: "ES"
              bookSpec:
                copies: 500
                interior_pages: 192
                format: "148x210"
                paper_inner: "offset_white_90"
                paper_cover: "couche_gloss_250"
                binding: "softcover_pur"
      responses:
        '201':
          description: Order successfully initialized in DRAFT status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateOrderResponse'
              example:
                ok: true
                orderId: "ord_9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d"
                status: "DRAFT"
                requiredFiles:
                  - "INTERIOR_PDF"
                  - "COVER_PDF"
                readiness:
                  ready: false
                  blockers:
                    - "MISSING_REQUIRED_FILE_INTERIOR_PDF"
                    - "MISSING_REQUIRED_FILE_COVER_PDF"
        '400':
          description: Missing customer details or book specifications.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderErrorResponse'
              examples:
                missing_customer:
                  value:
                    ok: false
                    error: "CUSTOMER_REQUIRED"
                    message: "Customer details are required to initialize an order."
                missing_book_spec:
                  value:
                    ok: false
                    error: "BOOK_SPEC_REQUIRED"
                    message: "Book specification is required to initialize an order."
        '401':
          description: Unauthorized access (invalid credentials or intake token).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderErrorResponse'
              example:
                ok: false
                error: "UNAUTHORIZED"
                message: "Authentication required."
        '500':
          description: Internal error while persisting the order in the database.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderErrorResponse'
              example:
                ok: false
                error: "ORDER_CREATION_FAILED"
                message: "Database insertion failure."

  /api/marketplace/orders/{orderId}:
    get:
      tags:
        - Marketplace Orders
      summary: Query order details, files, and manufacturing readiness evaluation
      description: Returns complete order information, uploaded files, audit events, and manufacturing blockers.
      operationId: getMarketplaceOrder
      x-ppos-lifecycle: IMPLEMENTED_IN_CODE
      x-ppos-controller: src/api/routes/marketplaceOrders.js:184
      x-ppos-runtime-status: PENDING_RUNTIME_VERIFICATION
      security:
        - MarketplaceIntakeToken: []
        - BearerJWT: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
          description: Unique order identifier.
      responses:
        '200':
          description: Full order details returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetailResponse'
              example:
                ok: true
                order:
                  orderId: "ord_9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d"
                  status: "DRAFT"
                  currency: "EUR"
                files: []
                preflightBindings: []
                events: []
                readiness:
                  ready: false
                  blockers:
                    - "MISSING_REQUIRED_FILE_INTERIOR_PDF"
        '401':
          description: Unauthorized access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderErrorResponse'
              example:
                ok: false
                error: "UNAUTHORIZED"
                message: "Authentication required."
        '404':
          description: Order not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderErrorResponse'
              example:
                ok: false
                error: "ORDER_NOT_FOUND"
                message: "Order ord_9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d not found."
        '500':
          description: Failed to retrieve order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderErrorResponse'
              example:
                ok: false
                error: "GET_ORDER_FAILED"
                message: "Database query failed."

  /api/marketplace/orders/{orderId}/selected-offer:
    post:
      tags:
        - Marketplace Orders
      summary: Update the selected commercial offer for the order
      operationId: updateOrderSelectedOffer
      x-ppos-lifecycle: IMPLEMENTED_IN_CODE
      x-ppos-controller: src/api/routes/marketplaceOrders.js:250
      x-ppos-runtime-status: PENDING_RUNTIME_VERIFICATION
      security:
        - MarketplaceIntakeToken: []
        - BearerJWT: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: |
                Selected offer payload. The implementation in `src/api/routes/marketplaceOrders.js:252` evaluates `req.body.selectedOffer || req.body`.
                Controller precedence rules:
                1. If `selectedOffer` is present in the request body, the controller prioritizes it. That object MUST contain a non-empty `offerId` or `id`. If `selectedOffer` is an empty object `{}` or lacks valid identifiers, the controller rejects the request with HTTP 400 (`INVALID_OFFER`), even if root-level `offerId` or `id` fields exist.
                2. If `selectedOffer` is not present, the controller evaluates `offerId` or `id` directly at the root level.
                3. Empty strings (`""`) in identifiers are rejected with HTTP 400.
              type: object
              oneOf:
                - description: Variant with selectedOffer object (prioritized by the controller when present)
                  required:
                    - selectedOffer
                  properties:
                    selectedOffer:
                      type: object
                      anyOf:
                        - required: [offerId]
                          properties:
                            offerId:
                              type: string
                              minLength: 1
                        - required: [id]
                          properties:
                            id:
                              type: string
                              minLength: 1
                      properties:
                        offerId:
                          type: string
                          minLength: 1
                          example: "off_01j7b9e84k2"
                        id:
                          type: string
                          minLength: 1
                          example: "off_01j7b9e84k2"
                        totalPrice:
                          type: number
                          example: 1650.00
                - description: Direct root-level variant (evaluated only when selectedOffer is absent)
                  not:
                    type: object
                    properties:
                      selectedOffer:
                        type: object
                    required:
                      - selectedOffer
                  anyOf:
                    - required: [offerId]
                      properties:
                        offerId:
                          type: string
                          minLength: 1
                    - required: [id]
                      properties:
                        id:
                          type: string
                          minLength: 1
                  properties:
                    selectedOffer:
                      type: object
                      description: If provided, this branch does not apply (branch 1 is evaluated instead)
                    offerId:
                      type: string
                      minLength: 1
                      example: "off_01j7b9e84k2"
                    id:
                      type: string
                      minLength: 1
                      example: "off_01j7b9e84k2"
                    totalPrice:
                      type: number
                      example: 1650.00
            examples:
              combinationPrecedence:
                summary: Coexistence of selectedOffer and root fields (controller prioritizes selectedOffer)
                value:
                  selectedOffer:
                    offerId: "off_A"
                    totalPrice: 1650.00
                  offerId: "off_B"
              wrappedOfferId:
                summary: Offer wrapped in selectedOffer with offerId
                value:
                  selectedOffer:
                    offerId: "off_01j7b9e84k2"
                    totalPrice: 1650.00
              wrappedId:
                summary: Offer wrapped in selectedOffer with id
                value:
                  selectedOffer:
                    id: "off_01j7b9e84k2"
                    totalPrice: 1650.00
              directOfferId:
                summary: Direct root-level offer with offerId
                value:
                  offerId: "off_01j7b9e84k2"
                  totalPrice: 1650.00
              directId:
                summary: Direct root-level offer with id
                value:
                  id: "off_01j7b9e84k2"
                  totalPrice: 1650.00
      responses:
        '200':
          description: Offer successfully updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  order:
                    type: object
              example:
                ok: true
                order:
                  orderId: "ord_9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d"
                  status: "OFFER_SELECTED"
        '400':
          description: Invalid offer payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderErrorResponse'
              example:
                ok: false
                error: "INVALID_OFFER"
                message: "A valid selectedOffer payload is required."
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderErrorResponse'
        '500':
          description: Error updating offer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderErrorResponse'

  /api/marketplace/orders/{orderId}/files/register:
    post:
      tags:
        - Marketplace Orders
      summary: Register metadata for an uploaded production file
      operationId: registerOrderFileMetadata
      x-ppos-lifecycle: IMPLEMENTED_IN_CODE
      x-ppos-controller: src/api/routes/marketplaceOrders.js:271
      x-ppos-runtime-status: PENDING_RUNTIME_VERIFICATION
      security:
        - MarketplaceIntakeToken: []
        - BearerJWT: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterFilePayload'
            example:
              role: "INTERIOR_PDF"
              originalName: "book_interior_final_v1.pdf"
              mimeType: "application/pdf"
              sizeBytes: 15420310
              checksumSha256: "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
              storagePath: "orders/ord_123/interior_v1.pdf"
      responses:
        '200':
          description: File metadata successfully registered.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  fileId:
                    type: string
              example:
                ok: true
                fileId: "fil_int_01"
        '400':
          description: Missing mandatory fields (`role` or `originalName`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderErrorResponse'
              example:
                ok: false
                error: "MISSING_FIELDS"
                message: "role and originalName are required."
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderErrorResponse'
        '404':
          description: Order not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderErrorResponse'
              example:
                ok: false
                error: "ORDER_NOT_FOUND"
                message: "ORDER_NOT_FOUND"
        '500':
          description: Error registering file.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderErrorResponse'

  /api/marketplace/orders/{orderId}/files/{fileId}/preflight-bind:
    post:
      tags:
        - Marketplace Orders
      summary: Bind a Preflight inspection job to an order file
      operationId: bindPreflightJobToFile
      x-ppos-lifecycle: IMPLEMENTED_IN_CODE
      x-ppos-controller: src/api/routes/marketplaceOrders.js:305
      x-ppos-runtime-status: PENDING_RUNTIME_VERIFICATION
      security:
        - MarketplaceIntakeToken: []
        - BearerJWT: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
        - name: fileId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - preflightJobId
              properties:
                preflightJobId:
                  type: string
                  description: Preflight inspection job identifier.
            example:
              preflightJobId: "pf_job_8a7d6e5c-1234"
      responses:
        '200':
          description: Preflight binding successfully persisted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  bindingId:
                    type: string
              example:
                ok: true
                bindingId: "bind_9988"
        '400':
          description: Missing `preflightJobId`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderErrorResponse'
              example:
                ok: false
                error: "PREFLIGHT_JOB_ID_REQUIRED"
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderErrorResponse'
        '404':
          description: Order or file slot not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderErrorResponse'
              example:
                ok: false
                error: "ORDER_NOT_FOUND"
                message: "ORDER_NOT_FOUND"
        '500':
          description: Error binding preflight analysis.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderErrorResponse'

  /api/marketplace/orders/{orderId}/readiness/recompute:
    post:
      tags:
        - Marketplace Orders
      summary: Recompute order manufacturing readiness
      operationId: recomputeOrderReadiness
      x-ppos-lifecycle: IMPLEMENTED_IN_CODE
      x-ppos-controller: src/api/routes/marketplaceOrders.js:331
      x-ppos-runtime-status: PENDING_RUNTIME_VERIFICATION
      security:
        - MarketplaceIntakeToken: []
        - BearerJWT: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Readiness status recomputed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  readiness:
                    type: object
                    properties:
                      ready:
                        type: boolean
                      blockers:
                        type: array
                        items:
                          type: string
              example:
                ok: true
                readiness:
                  ready: false
                  blockers:
                    - "MISSING_REQUIRED_FILE_COVER_PDF"
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderErrorResponse'
        '404':
          description: Order not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderErrorResponse'
              example:
                ok: false
                error: "ORDER_NOT_FOUND"
                message: "Order ord_123 not found."
        '500':
          description: Error recomputing readiness.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderErrorResponse'

  /api/public/preflight/human-report/{token}:
    get:
      tags:
        - Public Preflight
      summary: Query shared Preflight report (sanitized customer view)
      description: |
        Returns the customer-friendly Preflight diagnostic view after validating a signed JWT token (`scope: HUMAN_REPORT_VIEW`).
      operationId: getPublicPreflightHumanReport
      x-ppos-lifecycle: IMPLEMENTED_IN_CODE
      x-ppos-controller: src/api/routes/publicPreflight.js:6
      x-ppos-runtime-status: PENDING_RUNTIME_VERIFICATION
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
          description: Signed JWT token with `HUMAN_REPORT_VIEW` scope.
      responses:
        '200':
          description: Sanitized customer-facing preflight diagnostic.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicHumanReportResponse'
              example:
                ok: true
                job_id: "pf_job_8a7d6e5c-1234"
                snapshot_id: "snap_998877"
                generated_at: "2026-10-25T14:30:00.000Z"
                report:
                  outcome: "FIXED_REVIEW_REQUIRED"
                  severity: "warning"
                  summary_title: "File Preflight Verification Report"
                  customer_summary: "Automated bleed and resolution normalizations were applied."
                  recommended_next_action:
                    action_id: "review_required"
                    label: "Review required before production"
                    description: "The normalized file must be visually reviewed before releasing to CTP plates."
                    severity: "warning"
                    primary_artifact_available: true
                  artifact_recommendations:
                    - type: "fixed_pdf"
                      filename: "book_interior_normalized.pdf"
                      customer_visible: true
                      production_certified: false
                      artifact_role: "REVIEW_REQUIRED"
                      downloadable: false
                      size_bytes: 14890210
        '400':
          description: |
            Report request error. In the active implementation (`src/api/routes/publicPreflight.js:12`), upon validation failures (`INVALID_TOKEN`, `INVALID_SCOPE`) or missing snapshot (`SNAPSHOT_NOT_FOUND`), the controller evaluates `result.statusCode || 400`, returning HTTP 400 in all such cases.
            [PROPOSAL DEV-02]: It is proposed that SNAPSHOT_NOT_FOUND semantically return HTTP 404 (see `ProposedPreflightReport404Response`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreflightReportErrorResponse'
              examples:
                invalidToken:
                  summary: Malformed or invalid token
                  value:
                    ok: false
                    error: "INVALID_TOKEN"
                    message: "jwt malformed"
                snapshotNotFoundImplemented:
                  summary: Snapshot not found (current backend behavior)
                  value:
                    ok: false
                    error: "SNAPSHOT_NOT_FOUND"
                    message: "The report snapshot no longer exists."
        '500':
          description: Internal error retrieving the report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreflightReportErrorResponse'
              example:
                ok: false
                error:
                  message: "Internal server error"

  /api/marketplace/orders/{orderId}/customer-action/{token}:
    get:
      tags:
        - Public Preflight
        - Marketplace Orders
      summary: Customer file remediation and re-upload link
      description: |
        Validates the SHA-256 token hash and expiration timestamp, returning the required remediation action and current file status.
        
        Controller execution sequence (`src/api/routes/marketplacePublic.js:125-165`):
        1. Validates the token against the database (`validateCustomerToken`). The action is originally created with `status: 'PENDING_NOTIFICATION'` and `type: 'FILE_REUPLOAD_REQUIRED'` (`src/api/services/marketplaceCustomerActionService.js:165`).
        2. The controller executes `await customerActionService.markCustomerActionViewed(orderId, token)` BEFORE sending the response. The operation is awaited, but wrapped in a non-fatal `try/catch` block that tolerates database write errors so customer remediation is never blocked.
        3. The HTTP 200 response returns `action: validation.action`, corresponding to the snapshot read during initial validation (step 1). Therefore, on the first successful access it returns the state read at that moment (`PENDING_NOTIFICATION`).
        4. If the update in step 2 fails, the database does not record `VIEWED`; consequently, subsequent reads cannot be guaranteed to reflect `VIEWED`.
      operationId: validateCustomerActionToken
      x-ppos-lifecycle: IMPLEMENTED_IN_CODE
      x-ppos-controller: src/api/routes/marketplacePublic.js:125
      x-ppos-runtime-status: PENDING_RUNTIME_VERIFICATION
      security: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: |
            Required remediation action and valid file context.
            Sequence note: The response returns the action snapshot obtained during initial validation (`validation.action`), prior to marking it as viewed in the DB. Therefore, on initial access after creation, `status` is 'PENDING_NOTIFICATION'. If the subsequent DB update succeeded, later reads will reflect 'VIEWED'.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerActionResponse'
              examples:
                initialAccess:
                  summary: Initial customer access (status PENDING_NOTIFICATION from DB snapshot)
                  value:
                    success: true
                    orderId: "ord_9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d"
                    action:
                      type: "FILE_REUPLOAD_REQUIRED"
                      status: "PENDING_NOTIFICATION"
                      requiredFiles:
                        - "INTERIOR_PDF"
                      blockers:
                        - "LOW_IMAGE_DPI_PAGE_45"
                      message: "Please replace the interior book block PDF with 300 DPI images."
                      expiresAt: "2026-11-01T23:59:59.000Z"
                      createdAt: "2026-10-25T14:00:00.000Z"
                    currentFiles:
                      - fileId: "fil_int_01"
                        role: "INTERIOR_PDF"
                        status: "REJECTED"
                        preflightStatus: "FAILED"
                        outcomeCategory: "REJECTED_RESOLUTION"
                        findingsCount: 3
                        version: 1
                    trace_id: "trace_99887766"
                subsequentAccess:
                  summary: Subsequent access (reflects VIEWED if prior DB persistence succeeded)
                  value:
                    success: true
                    orderId: "ord_9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d"
                    action:
                      type: "REUPLOAD_REQUIRED"
                      status: "VIEWED"
                      requiredFiles:
                        - "INTERIOR_PDF"
                      blockers:
                        - "LOW_IMAGE_DPI_PAGE_45"
                      message: "Please replace the interior book block PDF with 300 DPI images."
                      expiresAt: "2026-11-01T23:59:59.000Z"
                      createdAt: "2026-10-25T14:00:00.000Z"
                    currentFiles:
                      - fileId: "fil_int_01"
                        role: "INTERIOR_PDF"
                        status: "REJECTED"
                        preflightStatus: "FAILED"
                        outcomeCategory: "REJECTED_RESOLUTION"
                        findingsCount: 3
                        version: 1
                    trace_id: "trace_99887766"
        '403':
          description: Token does not match the order hash or access is denied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerActionErrorResponse'
              example:
                success: false
                error: "INVALID_TOKEN"
                message: "Access denied: invalid or expired token."
                expiredAt: null
        '404':
          description: Order not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerActionErrorResponse'
              example:
                success: false
                error: "ORDER_NOT_FOUND"
                message: "Unable to process request."
                expiredAt: null
        '410':
          description: The remediation link has expired (`TOKEN_EXPIRED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerActionErrorResponse'
              example:
                success: false
                error: "TOKEN_EXPIRED"
                message: "This correction link has expired. Please request a new one."
                expiredAt: "2026-10-24T23:59:59.000Z"
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
              example:
                success: false
                message: "Internal server error."
                error_code: "INTERNAL_ERROR"
                trace_id: "trace_err_ca"

components:
  securitySchemes:
    MarketplaceIntakeToken:
      type: apiKey
      in: header
      name: x-marketplace-token
      description: |
        Shared secret intake token (`PPOS_MARKETPLACE_INTAKE_TOKEN`).
        Existing internal mechanism used between authorized frontends and the Control Plane.
        Not recommended for direct distribution to external partners without an API Key gateway.
    BearerJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: System operator or administrator JWT token.

  schemas:
    OfferRequestPayload:
      type: object
      required:
        - copies
        - interior_pages
      properties:
        copies:
          description: |
            Required quantity of copies.
            Current controller behavior (`src/api/routes/marketplacePublic.js:26`): evaluates presence/truthiness (`!payload.copies`). Accepts integers or truthy numeric strings.
            [PROPOSAL DEV-02]: Strictly require `type: integer` with `minimum: 1` (see `ProposedOfferRequestPayload`).
          oneOf:
            - type: integer
            - type: string
          example: 500
        interior_pages:
          description: |
            Number of interior book block pages.
            Current controller behavior (`src/api/routes/marketplacePublic.js:26`): evaluates presence/truthiness (`!payload.interior_pages`). Accepts integers or truthy numeric strings.
            [PROPOSAL DEV-02]: Strictly require `type: integer` with `minimum: 1` (see `ProposedOfferRequestPayload`).
          oneOf:
            - type: integer
            - type: string
          example: 192
        format:
          type: string
          description: |
            Standard book format string (e.g., "148x210", "A4").
            Current behavior: BPE and `normalizeSpecs` operate on format strings and do not parse dimensional objects.
            [PROPOSAL DEV-02]: Support dimensional object `{ width, height, unit }` (see `ProposedOfferRequestPayload`).
          example: "148x210"
        paper_inner:
          type: string
          description: Interior book block paper specification.
          example: "offset_white_90"
        paper_cover:
          type: string
          description: Cover paper specification.
          example: "couche_gloss_250"
        binding_method:
          type: string
          description: |
            Binding method. The `normalizeSpecs` function in `pricingEngineClient.js:283` transforms 'perfect_bound' -> 'perfect bound' and 'hard_cover' -> 'hardcover'.
          example: "perfect_bound"
        binding:
          type: string
          description: Legacy/informal binding alias.
          example: "softcover_pur"
        finishing_options:
          type: string
          description: |
            Finishing options. The `normalizeSpecs` function in `pricingEngineClient.js:287` transforms 'matt_lam_scratch' -> 'matt lamination', 'gloss_lam' -> 'gloss lamination', and 'soft_touch_lam' -> 'soft touch lamination'.
          example: "matt_lam_scratch"
        colors_inner:
          type: string
          description: Interior ink channels (e.g., '1/1', '4/4').
          example: "1/1"
        colors_cover:
          type: string
          description: Cover ink channels (e.g., '4/0').
          example: "4/0"
        finishings:
          type: array
          description: Additional finishing operations list (BPE compatibility).
          items:
            type: string
          example: ["matte_lamination"]
        delivery_country:
          type: string
          description: Destination country ISO 3166-1 alpha-2 code. Strictly validated by `normalizeSpecs` (pricingEngineClient.js:305).
          example: "ES"

    OffersResponse:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
        recommended_offer_id:
          description: Recommended commercial offer ID, or null if none was selected.
          oneOf:
            - type: string
            - type: "null"
        raw_recommended_offer_id:
          description: Recommended print house ID returned by BPE (house_id), or null if no offer matches (marketplacePublic.js:101).
          oneOf:
            - type: string
            - type: "null"
        trace_id:
          type: string
        offers:
          type: array
          items:
            $ref: '#/components/schemas/MarketplaceOffer'
        message:
          type: string
        error_code:
          type: string

    MarketplaceOffer:
      type: object
      properties:
        id:
          type: string
        offer_id:
          type: string
        house_id:
          type: string
        printer_id:
          type: string
        print_house_id:
          type: string
        print_house:
          type: string
        total_cost:
          type: number
        total_price:
          type: number
        currency:
          type: string
          default: EUR
        margin:
          type: number
        margin_percent:
          type: number
        estimated_delivery_time:
          type: string
        lead_time_days:
          type: integer
        recommended:
          type: boolean
        checkout_allowed:
          type: boolean
        source:
          type: string
        breakdown:
          type: array
          items:
            type: object
            properties:
              label:
                type: string
              amount:
                type: number
        raw_offer:
          type: object
          properties:
            lines:
              type: array
              items:
                type: object
                properties:
                  label:
                    type: string
                  amount:
                    type: number
            production_cost:
              type: number
            suggested_price:
              type: number

    CreateOrderPayload:
      type: object
      required:
        - customer
        - bookSpec
      properties:
        pricingSessionId:
          type: string
          example: "sess_89f7a6e1-9876"
        selectedOfferId:
          type: string
          example: "off_01j7b9e84k2"
        tenantId:
          type: string
          example: "tenant_default"
        printhouseId:
          type: string
          example: "ph_valencia_01"
        customer:
          type: object
          description: |
            Customer details. The current implementation validates that the object is non-null (`if (!customer)`).
            Inner fields such as email and name are recommended but non-blocking in the backend.
          properties:
            name:
              type: string
              example: "Minerva Publishing House Ltd."
            email:
              type: string
              format: email
              example: "production@minervapublishing.eu"
            phone:
              type: string
              example: "+34 912 345 678"
            address:
              type: object
              properties:
                street:
                  type: string
                  example: "28 Gran Via Avenue, 4th Floor"
                city:
                  type: string
                  example: "Madrid"
                postal_code:
                  type: string
                  example: "28013"
                country:
                  type: string
                  example: "ES"
        bookSpec:
          type: object
          description: Technical book specification.
          properties:
            copies:
              type: integer
              example: 500
            interior_pages:
              type: integer
              example: 192
            format:
              type: string
              example: "148x210"
            paper_inner:
              type: string
              example: "offset_white_90"
            paper_cover:
              type: string
              example: "couche_gloss_250"
            binding:
              type: string
              example: "softcover_pur"

    CreateOrderResponse:
      type: object
      required:
        - ok
        - orderId
        - status
      properties:
        ok:
          type: boolean
        orderId:
          type: string
        status:
          type: string
        requiredFiles:
          type: array
          items:
            type: string
        readiness:
          type: object
          properties:
            ready:
              type: boolean
            blockers:
              type: array
              items:
                type: string

    OrderDetailResponse:
      type: object
      required:
        - ok
        - order
      properties:
        ok:
          type: boolean
        order:
          type: object
        files:
          type: array
          items:
            type: object
        preflightBindings:
          type: array
          items:
            type: object
        events:
          type: array
          items:
            type: object
        readiness:
          type: object
          properties:
            ready:
              type: boolean
            blockers:
              type: array
              items:
                type: string

    RegisterFilePayload:
      type: object
      required:
        - role
        - originalName
      properties:
        role:
          type: string
          enum: [INTERIOR_PDF, COVER_PDF, PROOF_PDF, OTHER]
          example: "INTERIOR_PDF"
        originalName:
          type: string
          example: "book_interior_final_v1.pdf"
        mimeType:
          type: string
          example: "application/pdf"
        sizeBytes:
          type: integer
          example: 15420310
        checksumSha256:
          type: string
          example: "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
        storagePath:
          type: string
          example: "orders/ord_123/interior_v1.pdf"
        metadata:
          type: object

    PublicHumanReportResponse:
      type: object
      required:
        - ok
        - job_id
        - snapshot_id
        - report
      properties:
        ok:
          type: boolean
        job_id:
          type: string
        snapshot_id:
          type: string
        tenant_id:
          type: string
        generated_at:
          type: string
        report:
          type: object
          required:
            - outcome
          properties:
            outcome:
              type: string
            severity:
              type: string
            summary_title:
              type: string
            customer_summary:
              type: string
            recommended_next_action:
              type: object
              properties:
                action_id:
                  type: string
                label:
                  type: string
                description:
                  type: string
                severity:
                  type: string
                primary_artifact_available:
                  type: boolean
            artifact_recommendations:
              type: array
              items:
                type: object
                properties:
                  type:
                    type: string
                  filename:
                    type: string
                  customer_visible:
                    type: boolean
                  production_certified:
                    type: boolean
                  artifact_role:
                    type: string
                  downloadable:
                    type: boolean
                  size_bytes:
                    type: integer

    CustomerActionResponse:
      type: object
      required:
        - success
        - orderId
        - action
      properties:
        success:
          type: boolean
        orderId:
          type: string
        action:
          type: object
          properties:
            type:
              type: string
            status:
              type: string
            requiredFiles:
              type: array
              items:
                type: string
            blockers:
              type: array
              items:
                type: string
            message:
              type: string
            expiresAt:
              type: string
              format: date-time
            createdAt:
              type: string
              format: date-time
        currentFiles:
          type: array
          items:
            type: object
            properties:
              fileId:
                type: string
              role:
                type: string
              status:
                type: string
              preflightStatus:
                type: string
              outcomeCategory:
                type: string
              findingsCount:
                type: integer
              version:
                type: integer
        trace_id:
          type: string

    StandardErrorResponse:
      type: object
      required:
        - success
        - message
        - error_code
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
        error_code:
          type: string
        trace_id:
          type: string

    OrderErrorResponse:
      type: object
      required:
        - ok
        - error
      properties:
        ok:
          type: boolean
          example: false
        error:
          description: Error code or failure detail (string in controller or object in authentication middleware auth.js:268).
          oneOf:
            - type: string
            - type: object
              properties:
                code:
                  type: string
                message:
                  type: string
        message:
          type: string

    PreflightReportErrorResponse:
      type: object
      required:
        - ok
      properties:
        ok:
          type: boolean
          example: false
        error:
          description: Error code or failure message.
          oneOf:
            - type: string
            - type: object
              properties:
                message:
                  type: string
        message:
          type: string

    CustomerActionErrorResponse:
      type: object
      required:
        - success
        - error
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
        message:
          type: string
        expiredAt:
          description: Link expiration timestamp, or null if the error is unrelated to expiration (marketplacePublic.js:147).
          oneOf:
            - type: string
              format: date-time
            - type: "null"
