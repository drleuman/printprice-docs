openapi: 3.1.0
info:
  title: PrintPrice OS — Customer Shared Diagnostic & Remediation API
  version: 1.0.0
  description: |
    # PrintPrice OS — Customer Shared Diagnostic & Remediation API
    Ephemeral token and signed URL endpoints designed for direct, secure access by authors,
    publishers, and end customers without requiring interactive platform credentials.
    
    - **Visual Preflight Report:** Allows print houses to share an actionable technical verification summary.
    - **Customer Remediation Action:** Allows the customer to replace a rejected file following blocking preflight findings.
  contact:
    name: PrintPrice Architecture & Security Team
    email: api-support@printprice.pro
    url: https://docs.printprice.pro
  license:
    name: Proprietary / Partner Integration Only
    identifier: Proprietary

servers:
  - url: https://api.printprice.pro
    description: Production Gateway Server

tags:
  - name: Customer Shared Reports
    description: Customer-safe preflight diagnostics and guided file remediation.

paths:
  /api/public/preflight/human-report/{token}:
    get:
      tags:
        - Customer Shared Reports
      summary: Query shared visual preflight report
      description: |
        Accessed via a signed JWT token (`scope: HUMAN_REPORT_VIEW`). Returns a customer-friendly PDF diagnostic summary without exposing internal server paths or infrastructure metadata.
      operationId: getSharedHumanReport
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
          description: Cryptographically signed JWT token carrying view authorization.
      responses:
        '200':
          description: Visual preflight report successfully retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HumanReportResponse'
              example:
                ok: true
                job_id: "pf_job_8a7d6e5c-1234"
                snapshot_id: "snap_998877"
                tenant_id: "tenant_default"
                report:
                  outcome: "FIXED_REVIEW_REQUIRED"
                  summary:
                    title: "File Preflight Verification Report"
                    description: "Warnings were detected that require visual confirmation."
                    pages_analyzed: 192
                    color_space: "CMYK (FOGRA39)"
                  artifact_recommendations:
                    - artifact_id: "art_visual_diff_01"
                      artifact_type: "VISUAL_DIFF_PAGE_12"
                      label: "Correction comparison on page 12 (image resolution)"
                      customer_visible: true
                      download_url: "/api/public/preflight/artifacts/art_visual_diff_01?token=..."
                  customer_actions:
                    - action_id: "review_required"
                      label: "Review required before printing"
                      description: "The normalized file must be approved before releasing to CTP plates."
                      severity: "warning"
        '400':
          description: Snapshot not found in the database (status code currently returned by implementation).
        '401':
          description: Invalid, tampered, or expired token.

  /api/marketplace/orders/{orderId}/customer-action/{token}:
    get:
      tags:
        - Customer Shared Reports
      summary: Query instructions and status for file remediation / re-upload
      description: |
        Validates the SHA-256 remediation token and returns the required file slots, detected blockers, and instructions to upload a corrected version.
      operationId: getCustomerActionHandoff
      security: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
          description: Order identifier.
        - name: token
          in: path
          required: true
          schema:
            type: string
          description: Ephemeral remediation token.
      responses:
        '200':
          description: Remediation instructions successfully retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerActionResponse'
              example:
                success: true
                orderId: "ord_9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d"
                action:
                  type: "FILE_REUPLOAD_REQUIRED"
                  status: "PENDING_NOTIFICATION"
                  requiredFiles:
                    - "INTERIOR_PDF"
                  blockers:
                    - "LOW_IMAGE_DPI_PAGE_45"
                  message: "Please replace the interior book block PDF with 300 DPI images."
                  expiresAt: "2026-11-01T23:59:59.000Z"
                  createdAt: "2026-10-25T14:00:00.000Z"
                currentFiles:
                  - file_id: "fil_int_01"
                    role: "INTERIOR_PDF"
                    status: "REJECTED"
                    preflight_status: "FAILED"
                    preflight_outcome_category: "REJECTED_RESOLUTION"
                    findings_count: 3
                    version: 1
                trace_id: "trace_99887766"
        '403':
          description: Invalid token or token hash does not match the order.
        '404':
          description: Order not found.
        '410':
          description: The remediation link has expired.

components:
  schemas:
    HumanReportResponse:
      type: object
      properties:
        ok:
          type: boolean
        job_id:
          type: string
        snapshot_id:
          type: string
        tenant_id:
          type: string
        report:
          type: object

    CustomerActionResponse:
      type: object
      properties:
        success:
          type: boolean
        orderId:
          type: string
        action:
          type: object
        currentFiles:
          type: array
          items:
            type: object
        trace_id:
          type: string
