openapi: 3.1.0
info:
  title: PrintPrice OS — Preflight Inspection & Normalization API
  version: 1.0.0
  description: |
    # PrintPrice OS — Preflight API
    Automated technical PDF inspection API for commercial and book printing, extracting page geometry boxes (TrimBox, BleedBox),
    validating image resolution, CMYK color profiles, and executing automated geometry fixes (autofix).
    
    - **Responsible Service:** `ppos-preflight-service`
    - **Gateway Entrypoint:** `https://api.printprice.pro/api/preflight/*`
  contact:
    name: PrintPrice Architecture & Security Team
    email: api-support@printprice.pro
    url: https://docs.printprice.pro
  license:
    name: Proprietary / Partner Integration Only
    identifier: Proprietary

servers:
  - url: https://api.printprice.pro
    description: PrintPrice OS Production Server (Preflight Engine)

tags:
  - name: Preflight Capabilities
    description: Public discovery of supported validation rules and profiles.
  - name: Preflight Jobs
    description: Asynchronous inspection, analysis, and normalization processing for PDF files.

paths:
  /api/preflight/capabilities:
    get:
      tags:
        - Preflight Capabilities
      summary: Query preflight capabilities catalog, rules, and upload limits
      description: Returns the list of supported validation rules, available autofix operations, and maximum upload limits.
      operationId: getPreflightCapabilities
      security: []
      responses:
        '200':
          description: Technical capabilities of the preflight engine.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilitiesResponse'
              example:
                supportedRules:
                  - "GEOMETRY_TRIMBOX_VALIDATION"
                  - "BLEED_3MM_ENFORCEMENT"
                  - "IMAGE_RESOLUTION_300DPI"
                  - "COLOR_CMYK_ONLY"
                  - "FONTS_EMBEDDED_CHECK"
                availableFixes:
                  - "NORMALIZE_PAGE_BOXES"
                  - "GENERATE_SYNTHETIC_BLEED"
                  - "RGB_TO_FOGRA39_CONVERSION"
                geometryPolicies:
                  - "ISO_216_A_SERIES"
                  - "STANDARD_BOOK_SIZES"
                maxUploadSizeBytes: 2147483648
        '400':
          $ref: '#/components/responses/ErrorResponse'

  /api/preflight/jobs:
    post:
      tags:
        - Preflight Jobs
      summary: Submit PDF file for technical inspection
      description: |
        Uploads a PDF file (up to 2GB) via multipart/form-data and enqueues an analysis job on the Preflight workers.
      operationId: submitPreflightJob
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: PDF file to inspect.
      responses:
        '200':
          description: Job successfully enqueued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobCreatedResponse'
              example:
                ok: true
                jobId: "pf_job_8a7d6e5c-1234"
                status: "QUEUED"
                filename: "book_interior_block.pdf"
                sizeBytes: 15420310
        '400':
          description: Invalid request or missing file payload.
        '413':
          description: File exceeds the maximum allowed size of 2GB.
        '429':
          description: Maximum tenant concurrency limit reached.

  /api/preflight/jobs/{id}:
    get:
      tags:
        - Preflight Jobs
      summary: Query inspection job outcome and technical findings
      operationId: getPreflightJob
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Job identifier (pf_job_...).
      responses:
        '200':
          description: Job status and detailed technical report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobDetailResponse'
              example:
                ok: true
                job:
                  id: "pf_job_8a7d6e5c-1234"
                  status: "COMPLETED"
                  outcome: "PASSED_WITH_WARNINGS"
                  filename: "book_interior_block.pdf"
                  report:
                    pageCount: 192
                    trimBox: { widthPt: 419.53, heightPt: 595.28, widthMm: 148, heightMm: 210 }
                    bleedBox: { widthMm: 154, heightMm: 216, bleedMm: 3 }
                    colorProfile: "FOGRA39 (ISO 12647-2)"
                    hasRgbElements: false
                    lowestImageDpi: 240
                    findings:
                      - code: "IMAGE_DPI_SUBOPTIMAL"
                        severity: "warning"
                        page: 45
                        message: "Image on page 45 has 240 DPI (recommended minimum: 300 DPI)."
                  artifacts:
                    - id: "art_rep_01"
                      type: "report_json"
                      name: "report.json"
                    - id: "art_norm_pdf"
                      type: "normalized_pdf"
                      name: "normalized.pdf"
        '404':
          description: Job not found or does not belong to the authenticated tenant.

  /api/preflight/jobs/{id}/actions/fix:
    post:
      tags:
        - Preflight Jobs
      summary: Trigger automated remediation (autofix) on an inspected job
      operationId: triggerPreflightFix
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                autoFixOptions:
                  type: object
                  properties:
                    normalizeBoxes:
                      type: boolean
                      default: true
                    generateBleed:
                      type: boolean
                      default: true
                    convertRgbToCmyk:
                      type: boolean
                      default: true
      responses:
        '200':
          description: Automated remediation initiated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  fixJobId:
                    type: string
                  status:
                    type: string
                    example: "FIXING"
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'

  /api/preflight/jobs/{id}/artifacts/{artifactId}:
    get:
      tags:
        - Preflight Jobs
      summary: Download a generated inspection artifact file
      operationId: downloadPreflightArtifact
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: artifactId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Binary artifact stream (normalized PDF, JSON report, etc.).
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                type: object
        '404':
          description: Artifact not found.

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    CapabilitiesResponse:
      type: object
      properties:
        supportedRules:
          type: array
          items:
            type: string
        availableFixes:
          type: array
          items:
            type: string
        geometryPolicies:
          type: array
          items:
            type: string
        maxUploadSizeBytes:
          type: integer

    JobCreatedResponse:
      type: object
      properties:
        ok:
          type: boolean
        jobId:
          type: string
        status:
          type: string
        filename:
          type: string
        sizeBytes:
          type: integer

    JobDetailResponse:
      type: object
      properties:
        ok:
          type: boolean
        job:
          type: object

    ErrorResponse:
      type: object
      properties:
        ok:
          type: boolean
          example: false
        error:
          type: string
        message:
          type: string

  responses:
    ErrorResponse:
      description: Request error or validation failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
